[project]
name = "synthetic"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "core",
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic"]
